[project]
name = "evo-compute"
version = "0.0.6"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
dynamic = ["readme"]
authors = [
    { name = "Seequent", email = "support@seequent.com" }
]

dependencies = [
    "evo-blockmodels[utils]",
    "evo-objects[utils,blockmodels]",
    "evo-sdk-common",
    "jsonschema>=4.18",
    "pydantic>=2",
    "typing_extensions>=4.0",
]

[project.urls]
Source = "https://github.com/SeequentEvo/evo-python-sdk"
Tracker = "https://github.com/SeequentEvo/evo-python-sdk/issues"
Homepage = "https://www.seequent.com/"
Documentation = "https://developer.seequent.com/"

[project.optional-dependencies]
aiohttp = ["evo-sdk-common[aiohttp]"]
notebooks = ["evo-sdk-common[notebooks]"]

[dependency-groups]
# Dev dependencies. The version is left unspecified so the latest is installed.
test = [
    "evo-sdk-common[aiohttp]",
    # tests/test_stubgen.py runs a real checker over the generated stub; without one
    # installed those tests skip and the stub's static guarantees go unverified.
    "mypy",
    "parameterized==0.9.0",
    "pytest",
    "pyright",
    # The stub generator formats its output with ruff rather than imitating it, so
    # generation -- and `test_stub_is_up_to_date` -- needs it. Pinned to match the root
    # pyproject and .pre-commit-config.yaml, since formatting must be reproducible.
    "ruff==0.15.16",
]
dev = [
    "evo-sdk-common[notebooks]",
    "bumpver",
    "coverage[toml]",
    "ruff",
    {include-group = "test"},
]

[tool.pytest.ini_options]
# The parity suites share one harness module, so `tests` has to be importable under any import mode.
pythonpath = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "RUF022"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/evo"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Literal TOML strings (single quotes) need no escaping of backslashes.
# Converts relative links to absolute links in PyPI
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/SeequentEvo/evo-python-sdk/tree/main/packages/$HFPR_PACKAGE_NAME/\g<2>)'
