repos:
  - repo: local
    hooks:
      - id: check-uv-lock-sources
        name: Check uv.lock sources
        entry: python scripts/check_uv_lock_sources.py
        language: python
        files: (^|/)uv\.lock$
      - id: no-hardcoded-notebook-client-ids
        name: Reject hardcoded Evo client IDs in notebooks
        entry: 'native-[A-Za-z0-9]{12,}'
        language: pygrep
        files: \.ipynb$
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.16 # keep in sync with pyproject.toml
    hooks:
      - id: ruff
        name: Run linter
      - id: ruff-format
        name: Run formatter
        args: ["--check"]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: Strip outputs from Jupyter notebooks
