name: Tests and Linting

permissions:
  contents: read

on:
  pull_request:

jobs:
  run-pre-commit:
    name: Run pre commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.1

  run-linting:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/linting

  check-stubs:
    name: Check compute types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-uv
      - name: Check generated compute stub
        shell: bash
        run: make check-stubs-compute
      - name: Check typing examples with mypy and pyright
        shell: bash
        run: make check-types-compute

  run-tests:
    uses: ./.github/workflows/run-all-tests.yaml
