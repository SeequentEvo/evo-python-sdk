name: PyPI compatibility test

# This workflow simulates the experience of a developer installing our packages fresh from PyPI.
# Unlike the standard PR/push tests (which use the pinned uv.lock), a fresh install resolves
# the latest available versions of all dependencies, meaning any newly released package could
# introduce a breaking change that our pinned lockfile wouldn't catch.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  run-tests:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-uv
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Remove lockfile to resolve latest dependencies
        shell: bash
        run: rm -f uv.lock

      - name: Run tests against latest dependencies
        run: |
          uv run python scripts/run_package_tests.py

  run-notebook-tests:
    name: Notebook tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-uv
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Remove lockfile to resolve latest dependencies
        shell: bash
        run: rm -f code-samples/uv.lock

      - name: Run notebook tests
        env:
          EVO_CLIENT_ID: ${{ secrets.EVO_CLIENT_ID }}
          EVO_CLIENT_SECRET: ${{ secrets.EVO_CLIENT_SECRET }}
          EVO_ORG_ID: ${{ secrets.EVO_ORG_ID }}
          EVO_HUB_URL: ${{ secrets.EVO_HUB_URL }}
        run: >
          uv run
          --directory code-samples
          --group test
          pytest tests/ -v
