name: Run notebook tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  run-notebook-tests:
    name: Notebook tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        # Only one job runs the authenticated notebooks, so CI shares one Evo workspace.
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            run-auth-notebooks: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-uv
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Run notebook tests
        env:
          EVO_CLIENT_ID: ${{ matrix.run-auth-notebooks && secrets.EVO_CLIENT_ID || '' }}
          EVO_CLIENT_SECRET: ${{ matrix.run-auth-notebooks && secrets.EVO_CLIENT_SECRET || '' }}
          EVO_ORG_ID: ${{ matrix.run-auth-notebooks && secrets.EVO_ORG_ID || '' }}
          EVO_HUB_URL: ${{ matrix.run-auth-notebooks && secrets.EVO_HUB_URL || '' }}
        run: >
          uv run
          --directory code-samples
          --group test
          pytest tests/ -v
